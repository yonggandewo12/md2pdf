name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, system Python)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        # @firecrawl/anydoc + @firecrawl/pdf-inspector prebuilt binaries are
        # distributed via remote URLs; npm blocks them by default on this
        # runner. --allow-remote=all whitelists them for one install.
        # --registry pins the install source to the Huawei Cloud mirror;
        # CI runners ship without a user ~/.npmrc and would otherwise hit
        # registry.npmjs.org directly (slower + more rate-limited).
        # The runtime sub-packages are optionalDependencies: if the just-bumped
        # version isn't mirrored yet, npm only warns and install still succeeds.
        run: npm install --registry=https://mirrors.huaweicloud.com/repository/npm --allow-remote=all --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=20000

      - name: Install Python dependencies
        # Backward-compat path: verify that system Python + manual
        # pip install still works for users who set PPT_MASTER_PYTHON.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/ppt-master/requirements.txt
          python -m pip install -r scripts/excel/requirements.txt

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke load dist
        # Verify the MCP server entrypoint actually loads at runtime; tsc may
        # pass even if optional native bindings throw on import.
        run: node -e "import('./dist/index.js').then(()=>process.exit(0)).catch(e=>{console.error(e.message);process.exit(1)})"
        shell: bash

      - name: Smoke Python imports
        run: |
          python -c "import pptx, openpyxl, PIL; print('python deps OK')"

  test-embedded-runtime:
    # Verifies that npm ci pulls the matching general-tools-mcp-server-runtime-*
    # sub-package and that the embedded Python + wheels actually boot.
    # Build artifacts are produced by the publish workflow; this CI job runs
    # against whatever's already published on npm. When testing unreleased
    # changes, run the publish workflow's `build-platforms` job manually
    # and use a `npm view` smoke locally.
    name: Embedded runtime smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Node dependencies
        # --registry pins install to the Huawei Cloud mirror; CI runners
        # ship without ~/.npmrc and would otherwise hit registry.npmjs.org.
        run: npm install --registry=https://mirrors.huaweicloud.com/repository/npm --allow-remote=all --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=20000

      - name: Resolve embedded python binary
        id: resolve
        shell: bash
        run: |
          SUFFIX="${{ matrix.os == 'macos-latest' && 'darwin-arm64' || matrix.os == 'ubuntu-latest' && 'linux-x64-gnu' || 'win32-x64-msvc' }}"
          PKG="general-tools-mcp-server-runtime-${SUFFIX}"
          if [ ! -d "node_modules/${PKG}" ]; then
            # The embedded runtime sub-package only exists after the first
            # successful publish. Until then, skip the rest of this job
            # (informational) so CI doesn't gate merges.
            echo "::notice::Embedded runtime sub-package ${PKG} not installed yet; skipping smoke test. First successful publish will populate it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            PY="node_modules/${PKG}/python/python.exe"
          else
            PY="node_modules/${PKG}/python/bin/python3.12"
          fi
          echo "python=${PY}" >> "$GITHUB_OUTPUT"
          echo "Resolved embedded python: ${PY}"

      - name: Boot embedded python + import smoke
        # Verify the embedded relocatable Python boots AND has all the
        # required pip wheels installed in its site-packages.
        if: steps.resolve.outputs.skip != 'true'
        shell: bash
        run: |
          PY="${{ steps.resolve.outputs.python }}"
          "$PY" --version
          "$PY" -c "import pptx, openpyxl, PIL, mammoth, requests; print('embedded runtime OK')"

      - name: macOS Gatekeeper check
        if: matrix.os == 'macos-latest' && steps.resolve.outputs.skip != 'true'
        shell: bash
        run: |
          # Informational: warn if the binary still has quarantine attrs.
          # The publish workflow strips them on the build machine, but
          # the attribute does NOT propagate to consumers' machines —
          # each user must run xattr -dr themselves (documented in README).
          PY="${{ steps.resolve.outputs.python }}"
          if xattr "$PY" 2>/dev/null | grep -q com.apple.quarantine; then
            echo "::warning::quarantine present on $PY; users must run 'xattr -dr com.apple.quarantine' on their machine."
          else
            echo "No quarantine on $PY"
          fi